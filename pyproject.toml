[project]
name = "my-new-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
my-new-project = "my_new_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
